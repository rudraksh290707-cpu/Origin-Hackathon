<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRIDPULSE — Overview</title>
    <meta name="description" content="GRIDPULSE — AI-powered electricity demand intelligence. Real-time grid monitoring and demand forecasting.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- App shell is generated by script.js (sidebar + header) -->
    <div id="app"></div>

    <!-- ============================================================
         PAGE CONTENT — OVERVIEW
         Edit the HTML below to change the Overview page layout.
         The sidebar and header are auto-generated by script.js.
         ============================================================ -->
    <template id="page-template">
        <section class="page" id="page-overview" aria-label="Overview">
            <div class="page-header">
                <div>
                    <h2 class="page-title">Electricity Demand Intelligence</h2>
                    <p class="page-subtitle">24-hour demand forecast and grid risk monitoring</p>
                </div>
                <div class="page-controls">
                    <div class="control-group">
                        <label class="control-label">Region</label>
                        <div class="control-value">Delhi NCR</div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">Forecast</label>
                        <div class="control-value">24 Hours</div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">Model</label>
                        <div class="control-value">GridPulse v1.4</div>
                    </div>
                </div>
            </div>

            <!-- KPI Cards -->
            <div class="kpi-grid" id="kpiGrid">
                <div class="kpi-card" id="kpi-load">
                    <div class="kpi-header">
                        <span class="kpi-label">CURRENT LOAD</span>
                        <i data-lucide="zap" class="kpi-icon" aria-hidden="true"></i>
                    </div>
                    <div class="kpi-value" id="kpiLoad">
                        <span class="kpi-number" data-target="7820">0</span>
                        <span class="kpi-unit">MW</span>
                    </div>
                    <div class="kpi-footer">
                        <span class="kpi-change positive">↑ 4.2% vs yesterday</span>
                        <canvas class="kpi-spark" id="sparkLoad" width="80" height="30" aria-label="Load trend"></canvas>
                    </div>
                </div>
                <div class="kpi-card" id="kpi-peak">
                    <div class="kpi-header">
                        <span class="kpi-label">TOMORROW'S PEAK</span>
                        <i data-lucide="arrow-up-right" class="kpi-icon" aria-hidden="true"></i>
                    </div>
                    <div class="kpi-value" id="kpiPeak">
                        <span class="kpi-number" data-target="8470">0</span>
                        <span class="kpi-unit">MW</span>
                    </div>
                    <div class="kpi-footer">
                        <span class="kpi-meta">Expected at <strong id="kpiPeakTime">15:00</strong></span>
                        <canvas class="kpi-spark" id="sparkPeak" width="80" height="30" aria-label="Peak trend"></canvas>
                    </div>
                </div>
                <div class="kpi-card" id="kpi-util">
                    <div class="kpi-header">
                        <span class="kpi-label">CAPACITY UTILIZATION</span>
                        <i data-lucide="gauge" class="kpi-icon" aria-hidden="true"></i>
                    </div>
                    <div class="kpi-value" id="kpiUtil">
                        <span class="kpi-number" data-target="99.6" data-decimals="1">0</span>
                        <span class="kpi-unit">%</span>
                    </div>
                    <div class="kpi-footer">
                        <span class="kpi-meta">Capacity: <strong id="kpiCapacity">8,500 MW</strong></span>
                        <div class="progress-bar-container">
                            <div class="progress-bar" id="utilProgress" style="width:0%"></div>
                        </div>
                    </div>
                </div>
                <div class="kpi-card risk-card" id="kpi-risk">
                    <div class="kpi-header">
                        <span class="kpi-label">GRID RISK</span>
                        <i data-lucide="alert-triangle" class="kpi-icon" aria-hidden="true"></i>
                    </div>
                    <div class="kpi-value risk-value" id="kpiRisk">
                        <span class="risk-badge high" id="riskBadge">HIGH</span>
                    </div>
                    <div class="kpi-footer">
                        <div class="risk-indicator" id="riskIndicator">
                            <div class="risk-bar">
                                <div class="risk-fill" id="riskFill" style="width:0%"></div>
                            </div>
                            <div class="risk-labels">
                                <span>Normal</span><span>Watch</span><span>High</span><span>Critical</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content Grid -->
            <div class="overview-grid">
                <!-- Main Chart -->
                <div class="panel chart-panel" id="overviewChartPanel">
                    <div class="panel-header">
                        <div>
                            <h3 class="panel-title">24-Hour Demand Forecast</h3>
                            <p class="panel-subtitle">Predicted demand vs actual demand</p>
                        </div>
                        <div class="chart-controls">
                            <button class="chart-tab active" data-range="24h">24H</button>
                            <button class="chart-tab" data-range="7d">7D</button>
                            <button class="chart-tab" data-range="30d">30D</button>
                        </div>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="overviewChart" aria-label="24-hour demand forecast chart"></canvas>
                    </div>
                </div>

                <!-- Forecast Status -->
                <div class="panel forecast-status-panel">
                    <h3 class="panel-title">Peak Window</h3>
                    <div class="peak-window-info">
                        <div class="peak-time-range">
                            <i data-lucide="clock" aria-hidden="true"></i>
                            <span id="peakTimeRange">14:00 — 16:00</span>
                        </div>
                        <div class="peak-stat-grid">
                            <div class="peak-stat">
                                <span class="peak-stat-label">Expected Peak</span>
                                <span class="peak-stat-value" id="peakStatPeak">8,470 MW</span>
                            </div>
                            <div class="peak-stat">
                                <span class="peak-stat-label">Capacity</span>
                                <span class="peak-stat-value" id="peakStatCapacity">8,500 MW</span>
                            </div>
                            <div class="peak-stat">
                                <span class="peak-stat-label">Utilization</span>
                                <span class="peak-stat-value highlight" id="peakStatUtil">99.6%</span>
                            </div>
                            <div class="peak-stat">
                                <span class="peak-stat-label">Status</span>
                                <span class="peak-stat-value risk-text" id="peakStatStatus">HIGH RISK</span>
                            </div>
                        </div>
                        <p class="peak-message">Forecast indicates elevated grid stress during the afternoon peak.</p>
                        <button class="btn btn-secondary" id="viewRiskBtn" aria-label="View grid risk details">
                            VIEW GRID RISK <i data-lucide="arrow-right" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <!-- Demand Drivers -->
                <div class="panel">
                    <h3 class="panel-title">What's Driving Demand?</h3>
                    <p class="panel-subtitle">Model-estimated contribution to the forecast</p>
                    <div class="drivers-list" id="driversList"></div>
                </div>

                <!-- Weather Snapshot -->
                <div class="panel weather-snapshot-panel">
                    <h3 class="panel-title">Weather</h3>
                    <div class="weather-snapshot" id="weatherSnapshot">
                        <div class="weather-main">
                            <div class="weather-icon-wrap" aria-hidden="true">
                                <svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="var(--amber)" stroke-width="2">
                                    <circle cx="24" cy="24" r="8" fill="rgba(255,183,77,0.2)"/>
                                    <line x1="24" y1="4" x2="24" y2="10"/><line x1="24" y1="38" x2="24" y2="44"/>
                                    <line x1="4" y1="24" x2="10" y2="24"/><line x1="38" y1="24" x2="44" y2="24"/>
                                    <line x1="9.9" y1="9.9" x2="14.1" y2="14.1"/><line x1="33.9" y1="33.9" x2="38.1" y2="38.1"/>
                                    <line x1="9.9" y1="38.1" x2="14.1" y2="33.9"/><line x1="33.9" y1="14.1" x2="38.1" y2="9.9"/>
                                </svg>
                            </div>
                            <div class="weather-temp">
                                <span class="temp-value" id="weatherTemp">38°C</span>
                                <span class="temp-feels">Feels like <strong id="weatherFeels">41°C</strong></span>
                            </div>
                        </div>
                        <div class="weather-details">
                            <div class="weather-detail">
                                <i data-lucide="droplets" aria-hidden="true"></i>
                                <span>Humidity</span> <strong id="weatherHumidity">61%</strong>
                            </div>
                            <div class="weather-detail">
                                <i data-lucide="sun" aria-hidden="true"></i>
                                <span>Condition</span> <strong id="weatherCondition">Hot / Clear</strong>
                            </div>
                        </div>
                        <div class="weather-anomaly">
                            <span class="anomaly-badge">+2.1°C vs seasonal average</span>
                        </div>
                        <div class="weather-spark-container">
                            <canvas id="weatherSparkline" width="200" height="50" aria-label="Temperature trend"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Renewable Offset -->
                <div class="panel">
                    <h3 class="panel-title">Renewable Offset</h3>
                    <div class="renewable-offset" id="renewableOffset">
                        <div class="offset-visual">
                            <canvas id="offsetDonut" width="140" height="140" aria-label="Solar offset chart"></canvas>
                        </div>
                        <div class="offset-breakdown">
                            <div class="offset-row">
                                <span class="offset-label">Gross Demand</span>
                                <span class="offset-value" id="offsetGross">8,470 MW</span>
                            </div>
                            <div class="offset-row solar">
                                <span class="offset-label">− Solar Generation</span>
                                <span class="offset-value" id="offsetSolar">620 MW</span>
                            </div>
                            <div class="offset-divider"></div>
                            <div class="offset-row net">
                                <span class="offset-label">Net Demand</span>
                                <span class="offset-value" id="offsetNet">7,850 MW</span>
                            </div>
                            <div class="offset-contribution">
                                Solar contribution: <strong id="offsetPercent">7.3%</strong>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Recent Alerts -->
                <div class="panel">
                    <h3 class="panel-title">Recent Alerts</h3>
                    <div class="alerts-list" id="alertsList"></div>
                </div>
            </div>
        </section>
    </template>

    <script src="script.js"></script>
</body>
</html>
